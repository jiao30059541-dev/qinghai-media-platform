# Navidrome 音乐流媒体服务器 (飞牛应用中心版 or Docker)
# 推荐: 飞牛应用中心直接安装 (已装, 端口 4533)
# 如需 Docker 版:
services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: always
    ports:
      - "4533:4533"
    environment:
      - ND_SCANSCHEDULER=1m
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_BASEURL=
    volumes:
      - /vol1/1000/docker/navidrome:/data
      - /vol2/1000/music/音乐库:/music:ro    # 音乐库(只读)
    networks:
      - media-network

networks:
  media-network:
    external: true
