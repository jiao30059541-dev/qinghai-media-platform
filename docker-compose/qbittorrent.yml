# qBittorrent 下载器 (host 网络模式)
# 关键: host 网络 + /downloads 挂载 (非 /media!)
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: always
    network_mode: host
    environment:
      - PUID=0
      - PGID=0
      - TZ=Asia/Shanghai
      - WEBUI_PORT=8080
      - BT_PORT=6881
    volumes:
      - /vol1/1000/docker/qbittorrent:/config
      - /vol1/1000/media/downloads:/downloads   # ⚠️ 必须用 /downloads 前缀
