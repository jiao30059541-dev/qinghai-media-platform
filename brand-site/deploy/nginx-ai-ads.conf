# HTTP redirect
server {
    listen 80;
    server_name www.xnmytx.com xnmytx.com;
    return 301 https://www.xnmytx.com$request_uri;
}

# Xining Mingyangtianxia brand site
server {
    listen 443 ssl;
    server_name www.xnmytx.com;

    ssl_certificate /etc/letsencrypt/live/www.xnmytx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.xnmytx.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# Canonical apex redirect
server {
    listen 443 ssl;
    server_name xnmytx.com;

    ssl_certificate /etc/letsencrypt/live/www.xnmytx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.xnmytx.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.xnmytx.com$request_uri;
}
